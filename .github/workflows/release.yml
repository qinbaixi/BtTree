name: release

# Builds the Windows desktop app and publishes it to a GitHub Release when a version tag is pushed.
# The release notes come from the matching "## [x.y.z]" section of CHANGELOG.md.
# Run manually with a tag to only refresh that release's notes from the current CHANGELOG.md.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag (e.g. v0.1.0) whose release notes should be refreshed from CHANGELOG.md. Leave empty to build without publishing.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name == 'push' || github.event.inputs.tag == ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-notes.mjs "${{ github.ref_name }}" release-notes.md

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build installer and portable exe
        run: npm run package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: owl-bt-windows
          path: release/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            release/*.exe
            release/*.blockmap

  notes:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release notes from CHANGELOG
        run: node scripts/release-notes.mjs "${{ github.event.inputs.tag }}" release-notes.md

      - name: Update release notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          body_path: release-notes.md
